name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.8.4
      - run: ruff check .

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  integration-test:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Train a small model for the container
        run: python scripts/train_ci_model.py ci-model
      - name: Build the API image
        run: docker build -f api/Dockerfile -t lcdp-api:ci .
      - name: Start the API container
        run: |
          docker run -d --name api -p 127.0.0.1:8000:8000 \
            -v "$PWD/ci-model:/model:ro" -e MODEL_URI=/model lcdp-api:ci
      - name: Send requests to the running container
        run: pytest -m integration -v tests/integration/test_api_container.py
        env:
          API_URL: http://localhost:8000
      - name: API logs
        if: failure()
        run: docker logs api
