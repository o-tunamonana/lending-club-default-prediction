services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lcdp_test
      POSTGRES_PASSWORD: ${API_TEST_DB_PASSWORD:?set a temporary test password}
      POSTGRES_DB: lcdp_test
    volumes:
      - ../../db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U lcdp_test -d lcdp_test"]
      interval: 2s
      timeout: 3s
      retries: 20
  mlflow:
    image: lcdp-api-integration
    environment:
      MLFLOW_HTTP_REQUEST_TIMEOUT: "3"
    command: ["mlflow", "server", "--host", "0.0.0.0", "--backend-store-uri", "sqlite:////tmp/mlflow.db", "--artifacts-destination", "/tmp/artifacts"]
  api:
    build:
      context: ../..
      dockerfile: api/Dockerfile
    image: lcdp-api-integration
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      DATABASE_URL: postgresql://lcdp_test:${API_TEST_DB_PASSWORD}@postgres:5432/lcdp_test
      MLFLOW_HTTP_REQUEST_TIMEOUT: "3"
      MLFLOW_HTTP_REQUEST_MAX_RETRIES: "0"
      MODEL_RELOAD_SECONDS: "2"
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started
    ports:
      - "127.0.0.1::8000"
